[project]
name = "guardbench"
version = "0.1.0"
description = "Benchmark the System One model Jev against LLM judges for agent guardrail callbacks"
readme = "README.md"
authors = [
    { name = "Daniel Franco", email = "daniel.franco.inbox@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "anthropic>=1.8.0",
    "datasets>=5.0.1",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "httpx2>=2.13.0",
    "pyyaml>=6.0.3",
    "typesafe-sdk>=0.7.1",
]

[project.optional-dependencies]
adk = [
    "google-adk>=2.9.2",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "google-adk>=2.9.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
